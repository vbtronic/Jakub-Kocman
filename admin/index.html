<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Správa obsahu – KM-Elektro</title>
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
</head>
<body>
<!-- Verze je záměrně přibitá na konkrétní číslo, ať se administrace
     nerozbije sama od sebe, až vyjde nová verze Decapu. -->
<script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>
<script>
(function () {
  var h = window.h;
  var createClass = window.createClass;
  if (!window.CMS || !h || !createClass) return;   // beze změny, když se API posune

  var WEB = 'https://vbtronic.github.io/Jakub-Kocman/';

  // Cesta k obrázku na adresu, kterou zvládne <img>.
  // Nahraná fotka ještě není na webu, tu umí zobrazit jen getAsset.
  function adresa(getAsset, cesta) {
    if (!cesta) return '';
    try {
      var a = getAsset(cesta);
      if (a && String(a)) return String(a);
    } catch (e) { /* spadneme na veřejnou adresu níž */ }
    return WEB + String(cesta).replace(/^\//, '');
  }

  // Chyba v náhledu nesmí položit celou administraci — bez tohohle
  // pojistky spadne Decap celý a nejde ani editovat.
  function bezpecny(nazev, vykresli) {
    return createClass({
      render: function () {
        try {
          return vykresli(this.props);
        } catch (e) {
          if (window.console) console.error('Náhled "' + nazev + '" selhal:', e);
          return h('p', { className: 'nah-prazdno' },
            'Náhled se nepodařilo vykreslit. Editace funguje dál.');
        }
      }
    });
  }

  function seznam(entry, klic) {
    var v = entry.getIn(['data', klic]);
    if (!v) return [];
    return v.toJS ? v.toJS() : v;
  }

  // ---------------------------------------------------------- galerie
  var NahledGalerie = bezpecny('galerie', function (props) {
      var fotky = seznam(props.entry, 'fotky');
      if (!fotky.length) return h('p', { className: 'nah-prazdno' }, 'Zatím tu nejsou žádné fotky.');

      return h('div', { className: 'nah' },
        h('div', { className: 'nah-hlava' },
          h('strong', {}, 'Galerie'),
          h('span', {}, fotky.length + ' fotek · ' + fotky.filter(function(f){return f.uvod}).length + ' na úvodní stránce')
        ),
        h('div', { className: 'nah-mrizka' }, fotky.map(function (f, i) {
          return h('figure', { key: i, className: f.uvod ? 'nah-uvod' : '' },
            h('img', {
              src: adresa(props.getAsset, f.nahled || f.soubor),
              alt: f.popis || '',
              loading: 'lazy'
            }),
            h('figcaption', { className: f.popis ? '' : 'nah-chybi' },
              f.popis || 'bez popisku'),
            f.uvod ? h('span', { className: 'nah-znacka' }, 'úvod') : null
          );
        }))
      );
  });

  // ---------------------------------------------------------- služby
  var NahledSluzby = bezpecny('služby', function (props) {
      var sluzby = seznam(props.entry, 'sluzby');
      if (!sluzby.length) return h('p', { className: 'nah-prazdno' }, 'Zatím tu nejsou žádné služby.');

      return h('div', { className: 'nah' },
        h('div', { className: 'nah-hlava' },
          h('strong', {}, 'Služby a ceník'),
          h('span', {}, sluzby.length + ' kartiček na úvodní stránce')
        ),
        h('div', { className: 'nah-karty' }, sluzby.map(function (s, i) {
          return h('div', { key: i, className: 'nah-karta' },
            h('h3', {}, s.nadpis || 'bez názvu'),
            h('p', {}, s.popis || ''),
            h('span', { className: 'nah-cena' }, s.cena || '')
          );
        }))
      );
  });

  // ------------------------------------------------------ zkušenosti
  var NahledZkusenosti = bezpecny('zkušenosti', function (props) {
      var e = props.entry;
      var prace = seznam(e, 'prace');
      var vzdelani = seznam(e, 'vzdelani');

      return h('div', { className: 'nah' },
        h('div', { className: 'nah-hlava' },
          h('strong', {}, 'Praxe a vzdělání'),
          h('span', {}, prace.length + ' pozic · ' + vzdelani.length + ' položek vzdělání')
        ),
        h('p', { className: 'nah-lead' }, e.getIn(['data', 'podnadpis']) || ''),
        h('div', { className: 'nah-osa' }, prace.map(function (z, i) {
          return h('div', { key: i, className: 'nah-prace' },
            h('span', { className: 'nah-obdobi' }, z.obdobi || ''),
            h('strong', {}, z.firma || 'bez názvu'),
            h('span', { className: 'nah-pozice' }, z.pozice || ''),
            h('p', {}, z.popis || '')
          );
        })),
        vzdelani.length ? h('div', { className: 'nah-karty nah-odsazeno' },
          vzdelani.map(function (v, i) {
            return h('div', { key: i, className: 'nah-karta' },
              h('h3', {}, v.nadpis || 'bez názvu'),
              h('p', {}, v.popis || '')
            );
          })
        ) : null
      );
  });

  ['zkusenosti', 'kariera'].forEach(function (k) {
    CMS.registerPreviewTemplate(k, NahledZkusenosti);
  });

  // Registrujeme pod názvem kolekce i souboru — Decap se v tomhle
  // mezi verzemi liší a registrace navíc nic nerozbije.
  ['galerie', 'fotky'].forEach(function (k) {
    CMS.registerPreviewTemplate(k, NahledGalerie);
  });
  ['sluzby', 'seznam'].forEach(function (k) {
    CMS.registerPreviewTemplate(k, NahledSluzby);
  });

  CMS.registerPreviewStyle([
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#14181a;margin:0;padding:20px;background:#f6f7f6}',
    '.nah-hlava{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #e2e6e4}',
    '.nah-hlava strong{font-size:17px}',
    '.nah-hlava span{font-size:13px;color:#5c6b6f}',
    '.nah-prazdno{color:#5c6b6f;font-size:14px}',
    '.nah-mrizka{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}',
    '.nah-mrizka figure{margin:0;position:relative;background:#fff;border:1px solid #e2e6e4;border-radius:10px;overflow:hidden}',
    '.nah-mrizka img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee}',
    '.nah-mrizka figcaption{font-size:11.5px;line-height:1.35;padding:7px 9px;color:#14181a}',
    '.nah-chybi{color:#a4adaf;font-style:italic}',
    '.nah-uvod{box-shadow:0 0 0 2px #2f9e63}',
    '.nah-znacka{position:absolute;top:6px;left:6px;background:#1d6b45;color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px}',
    '.nah-karty{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}',
    '.nah-karta{background:#fff;border:1px solid #e2e6e4;border-radius:12px;padding:16px}',
    '.nah-karta h3{margin:0 0 6px;font-size:15px}',
    '.nah-karta p{margin:0;font-size:13px;color:#5c6b6f;line-height:1.45}',
    '.nah-cena{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;color:#1d6b45;background:#eaf3ed;padding:4px 10px;border-radius:99px}',
    '.nah-lead{margin:0 0 18px;font-size:14px;color:#5c6b6f}',
    '.nah-osa{border-left:2px solid #e2e6e4;padding-left:18px;display:grid;gap:16px}',
    '.nah-prace{position:relative}',
    '.nah-prace::before{content:"";position:absolute;left:-24px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2.5px solid #2f9e63}',
    '.nah-obdobi{display:block;font-size:11.5px;font-weight:600;color:#1d6b45;letter-spacing:.03em}',
    '.nah-prace strong{display:block;font-size:14.5px;margin-top:1px}',
    '.nah-pozice{display:block;font-size:12.5px;color:#5c6b6f;font-weight:500}',
    '.nah-prace p{margin:4px 0 0;font-size:12.5px;color:#5c6b6f;line-height:1.45}',
    '.nah-odsazeno{margin-top:20px}'
  ].join('\n'), { raw: true });
})();
</script>
</body>
</html>
