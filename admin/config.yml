# Nastavení administrace obsahu (Decap CMS).
# Přihlašování zajišťuje DecapBridge — uživatelé nepotřebují účet na GitHubu.

backend:
  name: git-gateway
  repo: vbtronic/Jakub-Kocman
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/75797948-8adf-46ea-8d46-7a4d9ce22bb3/pkce
  auth_token_endpoint: /sites/75797948-8adf-46ea-8d46-7a4d9ce22bb3/token
  gateway_url: https://gateway.decapbridge.com

  # V DecapBridge je zapnuté "Hide commit author", takže autorem commitu je
  # účet tokenu. Kdo změnu udělal, zůstává jen tady ve zprávě — a schválně
  # jen jménem: {{author-login}} je e-mail a repozitář je veřejný.
  commit_messages:
    create: 'Nový záznam: {{collection}} „{{slug}}“ ({{author-name}})'
    update: 'Úprava: {{collection}} „{{slug}}“ ({{author-name}})'
    delete: 'Smazáno: {{collection}} „{{slug}}“ ({{author-name}})'
    uploadMedia: 'Nahrána fotka {{path}} ({{author-name}})'
    deleteMedia: 'Smazána fotka {{path}} ({{author-name}})'
    openAuthoring: '{{message}} ({{author-name}})'

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

locale: cs
publish_mode: simple

# Fotky se nahrávají sem; GitHub Action je pak převede na webp,
# vyrobí náhled a přesune do img/g/ a img/t/.
media_folder: img/upload
public_folder: /Jakub-Kocman/img/upload

site_url: https://vbtronic.github.io/Jakub-Kocman/
display_url: https://vbtronic.github.io/Jakub-Kocman/
logo_url: https://vbtronic.github.io/Jakub-Kocman/img/apple-touch-icon.png

collections:
  - name: galerie
    label: Fotogalerie
    files:
      - name: fotky
        label: Fotky na webu
        file: data/galerie.yml
        editor:
          preview: true
        description: >-
          Fotky realizací. Nově nahraná fotka se sama zařadí nahoru.
          Zaškrtnutím vybereš, které se ukážou i na úvodní stránce.
        fields:
          - name: fotky
            label: Fotky
            label_singular: Fotka
            widget: list
            summary: '{{fields.popis}}'
            fields:
              - name: soubor
                label: Fotka
                widget: image
                hint: Nahraj fotku rovnou z mobilu, zmenší se sama.
              - name: nahled
                label: Náhled
                widget: hidden
                required: false
                default: ''
              - name: popis
                label: Popisek
                widget: string
                required: false
                hint: >-
                  Co je na fotce, např. „Nový rozvaděč rodinného domu“.
                  Pomáhá to ve vyhledávačích. Když necháš prázdné, doplní se
                  obecný popis.
              - name: uvod
                label: Zobrazit na úvodní stránce
                widget: boolean
                required: false
                default: false
                hint: >-
                  Zaškrtnuté fotky se ukazují i na úvodní stránce. Ostatní
                  jsou jen v galerii. Nemusíš nic přetahovat.

  - name: sluzby
    label: Služby a ceník
    files:
      - name: seznam
        label: Kartičky služeb
        file: data/sluzby.yml
        editor:
          preview: true
        description: Služby a ceny na úvodní stránce.
        fields:
          - name: sluzby
            label: Služby
            label_singular: Služba
            widget: list
            summary: '{{fields.nadpis}} — {{fields.cena}}'
            fields:
              - { name: nadpis, label: Název služby, widget: string }
              - { name: popis, label: Popis, widget: text }
              - name: cena
                label: Cena
                widget: string
                default: Cena dle rozsahu
                hint: 'Např. „Cena dle rozsahu“ nebo „od 450 Kč/hod“.'
              - name: ikona
                label: Ikona
                widget: select
                default: blesk
                options:
                  - { label: Dům, value: dum }
                  - { label: Klíč / oprava, value: klic }
                  - { label: Rozvaděč, value: rozvadec }
                  - { label: Žárovka / osvětlení, value: zarovka }
                  - { label: Výstraha / závada, value: vystraha }
                  - { label: Blesk, value: blesk }
                  - { label: Kolo / auto, value: kolo }
                  - { label: Zásuvka, value: zasuvka }

  - name: zkusenosti
    label: Pracovní zkušenosti
    files:
      - name: kariera
        label: Praxe a vzdělání
        file: data/zkusenosti.yml
        editor:
          preview: true
        description: >-
          Časová osa zaměstnání a vzdělání na úvodní stránce.
          Pořadí v seznamu = pořadí na webu, nejnovější nahoře.
        fields:
          - name: podnadpis
            label: Věta pod nadpisem
            widget: string
            hint: 'Krátké shrnutí, např. „Sedm let na stavbách, v průmyslu i u projekce“.'

          - name: prace
            label: Zaměstnání
            label_singular: Pozice
            widget: list
            summary: '{{fields.obdobi}} — {{fields.firma}}'
            fields:
              - name: obdobi
                label: Období
                widget: string
                hint: 'Např. „2022 – 2024“ nebo „12/2025 – současnost“.'
              - { name: firma, label: Firma, widget: string }
              - { name: pozice, label: Pracovní pozice, widget: string }
              - name: popis
                label: Co jsi tam dělal
                widget: text
                hint: Jedna až dvě věty o náplni práce.

          - name: vzdelani
            label: Vzdělání a oprávnění
            label_singular: Položka
            widget: list
            summary: '{{fields.nadpis}}'
            fields:
              - name: nadpis
                label: Škola nebo oprávnění
                widget: string
              - name: popis
                label: Upřesnění
                widget: text
                hint: 'Obor a roky, u oprávnění jeho rozsah.'
              - name: ikona
                label: Ikona
                widget: select
                default: cepice
                options:
                  - { label: Vysoká škola, value: cepice }
                  - { label: Střední škola, value: kniha }
                  - { label: Oprávnění / osvědčení, value: stit }

  - name: recenze
    label: Recenze zákazníků
    files:
      - name: hodnoceni
        label: Hodnocení z Google
        file: data/recenze.yml
        editor:
          preview: true
        description: >-
          Recenze se ukazují nad kontaktem. Dokud tu není žádná,
          sekce se na webu vůbec nezobrazí.
        fields:
          - name: odkaz
            label: Odkaz na profil s hodnoceními
            widget: string
            required: false
            hint: 'Z Google Maps: u firmy Sdílet → Kopírovat odkaz.'
          - name: recenze
            label: Recenze
            label_singular: Recenze
            widget: list
            summary: '{{fields.jmeno}} — {{fields.hvezdy}}★'
            fields:
              - name: jmeno
                label: Jméno zákazníka
                widget: string
                hint: Tak, jak je podepsaný u hodnocení.
              - name: hvezdy
                label: Počet hvězd
                widget: number
                default: 5
                value_type: int
                min: 1
                max: 5
              - name: text
                label: Text recenze
                widget: text
                hint: >-
                  Zkopíruj přesně, jak to člověk napsal. Nepřepisuj to
                  ani nevylepšuj — je to jeho slovo, ne naše.
