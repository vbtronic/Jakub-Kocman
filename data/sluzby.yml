# Služby a ceník zobrazený na úvodní stránce.
# Spravuje se přes administraci na /admin/ — ručně sem psát nemusíš.
sluzby:
  - nadpis: Kompletní elektroinstalace RD
    popis: >-
      Návrh a realizace rozvodů v novostavbách rodinných domů — od přípojky po
      zásuvky.
    cena: Cena dle rozsahu
    ikona: dum
  - nadpis: Rekonstrukce bytů
    popis: >-
      Kompletní výměna zastaralých hliníkových rozvodů, nové okruhy, jističe a
      zásuvky.
    cena: Cena dle rozsahu
    ikona: klic
  - nadpis: Výměny rozvaděčů
    popis: >-
      Modernizace domovních rozvaděčů, doplnění proudových chráničů a
      přepěťových ochran.
    cena: Cena dle rozsahu
    ikona: rozvadec
  - nadpis: Instalace osvětlení
    popis: >-
      Světla interiérová i venkovní, LED pásky, spínání, stmívání a chytré
      ovládání.
    cena: Cena dle rozsahu
    ikona: zarovka
  - nadpis: Odstraňování závad
    popis: Hledání a oprava poruch — vypadávající jističe, nefunkční okruhy, zkraty.
    cena: Cena dle rozsahu
    ikona: vystraha
  - nadpis: Menší elektroopravy
    popis: >-
      Výměna zásuvek, vypínačů, přisvětlení, drobné zásahy — rychle a bez
      čekání.
    cena: Cena dle rozsahu
    ikona: blesk
  - nadpis: Hodinový manžel
    popis: Drobné technické práce po domě i bytě — nábytek, police, kohoutky, údržba.
    cena: Cena dle rozsahu
    ikona: klic
  - nadpis: Příprava na STK & pneuservis
    popis: Kontrola vozu před technickou, přezutí sada za sadu.
    cena: Cena dle rozsahu
    ikona: kolo
